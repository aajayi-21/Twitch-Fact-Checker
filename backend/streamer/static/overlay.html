<!doctype html>
<!--
  OBS browser-source overlay: verdict displays rendered over the broadcast.

  Four console-selectable styles (see js/overlay/styles.mjs): toast,
  lowerthird, chip, stamp. The server-side choice (/overlay/config) applies
  LIVE via an overlay_config hub push, so the OBS source URL never changes;
  URL params pin values per-source and labels remain narrowing-only.

  Doctrine (unchanged from the first overlay):
  - transparent ground; zero interactivity (sources are spans — an <a> could
    navigate the source away mid-broadcast); pointer-events: none
  - transform/opacity animation only; no backdrop-filter (nothing behind a
    transparent page to blur, and it costs encoder headroom in CEF)
  - reconnect FOREVER (0.5s -> 15s); connection state shown only under
    ?preview=1 — a red badge on a live broadcast is worse than nothing
  - ?preview=1 paints a checkerboard so transparency is visible in a tab

  Query params (narrowing-only for labels; all whitelisted/clamped):
    style=toast|lowerthird|chip|stamp   position=<6 anchors>   duration=4..60
    labels=subset   topics via server   max=1..3   scale=0.5..3   margin=px
    offsetx/offsety=px   channel=<login>   token=<EVENTS_TOKEN>   preview=1

  OBS source settings: "Shutdown source when not visible" OFF and "Refresh
  browser when scene becomes active" OFF. OBS 30+ recommended (import maps
  + :has() need a modern CEF; see vendor/README.md).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fact-check overlay</title>
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/overlay.css">
<script type="importmap">
{
  "imports": {
    "preact":               "/static/vendor/preact/preact.module.js",
    "preact/hooks":         "/static/vendor/preact/hooks.module.js",
    "@preact/signals":      "/static/vendor/preact/signals.module.js",
    "@preact/signals-core": "/static/vendor/preact/signals-core.module.js",
    "htm":                  "/static/vendor/htm/htm.module.js"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/static/js/overlay/main.mjs"></script>
</body>
</html>
