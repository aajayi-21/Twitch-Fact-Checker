[project]
# Not "doxa": that name may belong to someone else on PyPI, and `uvx doxa`
# without --from would fetch it. The commands are still `doxa` and
# `doxa-streamer` (see [project.scripts]).
name = "doxa-backend"
version = "0.1.0"
description = "Local backend for the Doxa live-stream fact-checker extension"
requires-python = ">=3.11"

# Runtime dependencies, floored at the versions uv.lock pins and the test
# suite runs against. A checkout installs exactly the lock; `uvx` and `pip`
# ignore the lock, so these floors are what keep such an install from
# resolving to anything older than what was tested. No upper caps.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    # llm_openrouter.py and llm_local.py talk to OpenRouter / any
    # OpenAI-compatible local server through the OpenAI SDK.
    "openai>=2.53",
    "numpy>=1.26",
    "rapidfuzz>=3.14",
    "httpx>=0.28",
    # streamer/chat/transport.py (Twitch IRC) and streamer/ingest (the WS
    # client) are product surfaces, so this cannot live in the dev group —
    # it would only be installed transitively there, which is a latent break.
    "websockets>=16.1",
    "anthropic>=2.8",
    # The per-user data folder (.env, databases) outside a checkout.
    "platformdirs>=4.11",
]

# GPU speech-to-text backend (STT_BACKEND=torch), needed for Intel XPU and
# AMD ROCm — ctranslate2 reaches neither.
#
# This extra is NOT installed by `uv sync`; CPU users never pay for it. It is
# declared here anyway for a specific reason: uv resolves extras into the
# SAME universe as the base dependencies, so listing transformers pins a
# `tokenizers` version compatible with both it and faster-whisper. Without
# that, the lock picks the newest tokenizers faster-whisper allows and every
# `uv sync`/`uv run` silently breaks a hand-installed transformers.
#
# Install it with ./scripts/install_stt_gpu.sh, which uses uv's hardware
# detection (`--torch-backend=auto`) to pick the right wheel index — a lock
# file cannot encode "whatever accelerator this machine has".
[project.optional-dependencies]
# Speech-to-text on this machine. Not needed when the extension transcribes
# in the browser and sends text (STT_BACKEND=none, the default without it):
# ctranslate2, onnxruntime and av are a large download for nothing then.
#   uvx --from 'doxa-backend[stt] @ git+https://…#subdirectory=backend' doxa
# A checkout gets it anyway through the "speech" dependency group below.
stt = [
    # faster-whisper (ctranslate2: CPU + CUDA). Its bundled Silero VAD is
    # also what the torch and Parakeet engines and VAD segmentation use.
    "faster-whisper>=1.2",
]
#
# Upper bounds, unlike the base list: install_stt_gpu.sh installs this extra
# OUTSIDE the lock (uv pip, accelerator index), so the lock cannot pin it and
# a bare floor would let the next major of torch/transformers arrive silently
# on the one code path (app/stt_torch.py) that tracks their generate()
# internals. Bump deliberately after validating on real hardware.
gpu = [
    # The torch and Parakeet engines reuse faster-whisper's Silero VAD.
    "faster-whisper>=1.2",
    "torch>=2.13,<2.14",
    "transformers>=5.15,<6",
    "accelerate>=1.0",
    # STT_BACKEND=parakeet: transformers' ParakeetFeatureExtractor builds its
    # mel filterbank with librosa and refuses to load without it.
    "librosa>=0.10,<2",
]
# The ingest CLI's OPTIONAL niceties. streamlink/ffmpeg are shelled out to as
# system binaries (the CLI probes PATH and prints install hints), but
# streamlink is also pip-installable — `uv sync --extra ingest` drops a shim
# into .venv/bin, which shutil.which finds under `uv run`. Never imported.
ingest = [
    "streamlink>=6.0",
]
# --source device: local/loopback capture via PortAudio.
device = [
    "sounddevice>=0.4",
]

[project.scripts]
doxa = "app.cli:main"
doxa-streamer = "app.cli:streamer_main"
fact-checker-ingest = "streamer.ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "black>=24.4",
]
# The same as the `stt` extra, as a default group: a checkout's plain
# `uv sync` keeps installing the speech engine, as it always has.
speech = [
    "faster-whisper>=1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Slow tests download and run a real speech model; run them explicitly with:
#   uv run pytest -m slow
addopts = "-m 'not slow'"
markers = [
    "slow: needs a real speech model download",
]

[tool.uv]
# Installed by `uv sync` without flags: pytest for contributors, and the
# speech engine (see the `speech` group).
default-groups = ["dev", "speech"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "streamer"]
