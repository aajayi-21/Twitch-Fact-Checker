<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doxa</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <!-- The mark: a D of transcript lines, the flagged one in the accent. -->
        <svg class="popup-logo" viewBox="34 26 62 76" width="23" height="28" aria-hidden="true" focusable="false">
          <g class="logo-ink" stroke-width="9">
            <path d="M40.5 34.5H70.4" />
            <path d="M40.5 49.25H84.1" />
            <path d="M40.5 64H87.5" />
            <path class="logo-accent" d="M40.5 78.75H84.1" />
            <path d="M40.5 93.5H70.4" />
          </g>
        </svg>
        <div class="popup-header-text">
          <h1 class="popup-title">
            <!-- The wordmark "doxa", its x rising like a check mark. -->
            <svg viewBox="0 13 229 80" width="57" height="20" role="img" aria-label="Doxa">
              <g class="logo-ink" stroke-width="9">
                <circle cx="30" cy="64" r="20" />
                <path d="M50 22V84" />
                <circle cx="89" cy="64" r="20" />
                <path d="M126 44L162 84" />
                <path class="logo-accent" d="M126 84L175 30" />
                <circle cx="199" cy="64" r="20" />
                <path d="M219 44V84" />
              </g>
            </svg>
          </h1>
          <p class="backend-line" id="backend-line" data-state="checking">
            Checking backend…
          </p>
        </div>
      </header>

      <section class="status-card">
        <span class="status-dot" id="status-dot" data-state="idle"></span>
        <span class="status-text" id="status-text">Idle</span>
      </section>

      <p class="cost-line" id="cost-line" hidden></p>

      <section class="topics-line">
        <span class="topics-summary" id="topics-summary">Topics: …</span>
        <button type="button" class="topics-edit" id="topics-edit">Edit</button>
      </section>

      <p class="error-line" id="error-line" hidden></p>
      <p class="hint-line" id="hint-line" hidden></p>
      <p class="hint-line" id="offline-hint" hidden>
        Start the backend:
        <code>uvicorn app.main:app --host 127.0.0.1 --port 8710</code> in
        <code>/backend</code>
      </p>

      <section class="setup-card" id="setup-card" hidden>
        <p class="setup-text">Add your API key to start fact-checking</p>
        <button type="button" class="button button-settings" id="open-settings-button">
          Add a key
        </button>
      </section>

      <div class="actions">
        <button class="button button-start" id="start-button" disabled>
          Start fact-checking
        </button>
        <button class="button button-stop" id="stop-button" hidden>Stop</button>
      </div>

      <button type="button" class="dashboard-link" id="open-dashboard">
        Open dashboard
      </button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
